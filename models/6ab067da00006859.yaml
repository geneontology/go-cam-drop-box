id: gomodel:6ab067da00006859
title: Cone to OFF bipolar glutamatergic transmission (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-10-09'
comments:
- 'Curated with GO AI HUB. Light-adapted cone to OFF bipolar cell glutamatergic transmission
  in mouse: Cav1.4 -> Syt1-triggered release -> kainate/AMPA receptors.'
- 'Light-adapted (photopic) signal transmission from cone photoreceptors to OFF cone
  bipolar cells, phototransduction omitted. Light hyperpolarizes the cone; Cav1.4
  (Cacna1f) is voltage-gated, so hyperpolarization reduces Ca2+ influx at the ribbon
  active zone, reducing Syt1-triggered glutamate exocytosis and thus kainate/AMPA
  receptor activation in OFF bipolar dendrites (sign-preserving: OFF bipolar cells
  hyperpolarize). Causal edges are drawn in the activity-flow (positive) direction;
  under light all activities decrease together. Receptor enablers are GO complexes
  because the mouse OFF-bipolar subunit composition (GluK1? GluA?) was not verified
  from accessible full text.'
