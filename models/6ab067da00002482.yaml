id: gomodel:6ab067da00002482
title: Rod-rod bipolar postsynapse organization via LRIT3_Visual Perception (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-23'
comments:
- '2026-10-02: LRIT3 BP refined per curator - part_of GO:1903539 protein localization
  to postsynaptic membrane (replaces GO:0099173 postsynapse organization).'
- '2026-10-05 MF update (curator decision): LRIT3 root GO:0003674 replaced by GO:0098632
  cell-cell adhesion mediator activity, has_input NYX located_in plasma membrane of
  the rod bipolar cell dendrite (trans). Evidence for LRIT3 enabled_by and has_input
  NYX = NAS ECO:0000303 PMID:42055330 (authors'' model: LRIT3 LRR domain binds nyctalopin
  transsynaptically). CAVEAT: LRIT3-NYX binding was shown only in cis, by co-IP in
  co-transfected HEK293 cells (PMID:31959619); trans binding and adhesion are not
  demonstrated. NYX unit = GO:0030674 protein-macromolecule adaptor activity, has_input
  TRPM1 and GRM6, ISS GO_REF:0000024 with MGI:2448607 (Nyx): Nyx-Trpm1 binding in
  mouse retina (IP-MS/MS) and HEK (PMID:21832182), MYTH + HEK (PMID:21734298); Nyx-Grm6
  binding in HEK only (PMID:21832182); Trpm1 and Grm6 do not bind each other directly
  (MYTH, PMID:21734298). NYX location: mouse DBC dendritic tips (PMID:17881478, PMID:21734298).'
- 'Curated with GO AI HUB. Rod bipolar postsynapse: LRIT3 and NYX organize the TRPM1
  channel at the dendritic tips.'
- 'LRIT3 causal edges (curator decisions): LRIT3 -RO:0002629 directly positively regulates->
  NYX adaptor (2026-10-05): presynaptic LRIT3 is required for NYX localization at
  rod bipolar dendritic tips (lost in Lrit3 KO, PMID:31959619; LRR domain required,
  PMID:42055330). NYX -RO:0012009 constitutively upstream of-> TRPM1: NYX is required
  for TRPM1 at the DBC dendritic plasma membrane (nob mice, PMID:21734298). 2026-10-05:
  the direct LRIT3 -> TRPM1 edge was REMOVED (curator decision): LRIT3 acts on TRPM1
  through NYX, and no direct LRIT3-TRPM1 interaction has been shown. Note: NYX is
  necessary but not sufficient for TRPM1 localization; the LRIT3 IG domain is additionally
  required (PMID:42055330; the authors propose, without showing, an IG-TRPM1 interaction).
  At rod synapses GRM6 localization is LRIT3- and NYX-independent, so GRM6 has no
  activity unit here and appears only as has_input of the NYX adaptor.'
- 'Mouse experimental basis for ISS. LRIT3 rod photoreceptor expression and rod spherule
  location: PMID:31189098 (ISH; RHO-promoter rescue), PMID:42055330 (rod terminals).
  LRIT3 part_of protein localization to postsynaptic membrane (GO:1903539; NYX and
  TRPM1 lost from rod bipolar tips, total TRPM1 unchanged, rod synapse structure intact):
  PMID:25997951, PMID:31189098, PMID:31959619, PMID:42055330. LRIT3 visual perception:
  PMID:24598786, PMID:42471459. TRPM1 channel activity: PMID:19966281 (mouse IDA);
  TRPM1 at DBC dendrites: PMID:25997951.'
- 'claude4go build 2026-10-02, updated 2026-10-05 (curator ORCID 0000-0003-1522-9900).
  ROD synapse model; cone counterpart is gomodel:6ab067da00005098. Human. Facts ISS
  (ECO:0000250, GO_REF:0000024) from mouse orthologs (with/from MGI:2685267 Lrit3,
  MGI:2448607 Nyx, MGI:1330305 Trpm1), except LRIT3 MF enabled_by and has_input NYX
  = NAS PMID:42055330. Source curation: ~/Phototransduction/LRIT3/ and ~/Phototransduction/NYX/.'
