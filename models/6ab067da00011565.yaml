id: gomodel:6ab067da00011565
title: REG3G-EXTL3 signalling suppresses the kynurenine pathway and protects HK1-dependent
  glycolysis (Human)
taxon: NCBITaxon:9606
status: production
date_modified: '2026-10-26'
comments:
- 'Curated with GO AI HUB. Human counterpart of gomodel:6ab067da00011397: REG3G-EXTL3
  signalling suppresses the kynurenine pathway and protects HK1-dependent glycolysis.'
- Human counterpart of mouse model gomodel:6ab067da00011397, same structure. Facts
  resting on mouse data from PMID:35263589 are ISS (GO_REF:0000024) with the mouse
  gene; where the mouse model used ISS from a human ortholog, this model cites that
  human experimental evidence directly. Microglial and neuronal context is ISS from
  mouse.
- Quinolinate (CHEBI:29959) is not the direct product of any activity in this model.
  HAAO outputs cis,cis-2-amino-3-carboxymuconate 6-semialdehyde (CHEBI:77612, RHEA:17953),
  which cyclises to quinolinate spontaneously. There is no enzyme and therefore no
  activity unit for that step; the quinolinate node represents its product, and the
  HAAO -> SRC causal edge carries the biology.
- XIAP is modelled with signaling adaptor activity (GO:0035591), transferred by ISS
  from mouse Xiap. The underlying mouse data (PMID:35263589 Fig. 6C binding, Fig.
  6D knockdown) do not establish which function XIAP performs; XIAP's established
  MF is E3 ubiquitin ligase activity, untested in this pathway.
