id: gomodel:6ab067da00013223
title: Fatty acid beta-oxidation via glucagon-AMPK-Acacb (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-11-16'
comments:
- 'Curated with GO AI HUB. Mouse hepatic fatty acid beta-oxidation driven by glucagon:
  Gcg-Gcgr-Gnas-Adcy6-cAMP-PKA signaling and AMPK inhibition of Acacb, relieving malonyl-CoA
  inhibition of Cpt1a.'
- 'Focused model of glucagon-driven hepatic lipid oxidation through relief of malonyl-CoA
  inhibition of Cpt1a. AMPK enabled by GO:0031588 because no paper resolves the catalytic
  isoform. Enabled-by evidence (2026-11-16): IMP PMID:21459323 (Li 2011: AMPK activators
  no longer induce SREBP-1c Ser372 phosphorylation in AMPKalpha1/alpha2 double-knockout
  mouse embryonic fibroblasts, Fig 7C; dominant-negative AMPK reduces it in primary
  mouse hepatocytes, Fig 7G; purified rat AMPK phosphorylates SREBP-1c Ser372 in an
  in vitro [32P]-ATP kinase assay, Fig 7A). Replaces IDA PMID:19046568, whose Fig
  2A shows Thr172 phosphorylation only. Contrary evidence: PMID:32184359 found no
  effect of glucagon on AMPK activity in mouse hepatocytes. The glucagon-specific
  ACC data are from rat hepatocytes and do not resolve ACC1 from ACC2 (PMID:2898386
  AMPK not PKA; PMID:711753, PMID:632284 malonyl-CoA). In mouse liver, Acc1/Acc2 are
  redundant: single Acc2-S212A knock-in had minimal effects (PMID:24185692); liver
  malonyl-CoA was unchanged in Acc2-/- (PMID:11283375); see also PMID:20368432. Retracted,
  not used: PMID:20663988.'
- 'Gcg, Gcgr and Gnas units (updated 2026-11-10): ISS (GO_REF:0000024) from human
  GCG (UniProtKB:P01275) / human GCGR (UniProtKB:P47871) on Gcg ''enabled by'', ''has
  input Gcgr'', ''part of adenylate cyclase-activating G protein-coupled receptor
  signaling pathway'' and on Gcgr ''enabled by'', ''has input Gnas'', ''part of''
  the same pathway and ''directly positively regulates Gnas'' are based on Qiao 2020
  (PMID:32193322; cryo-EM structures of human GCGR bound to glucagon with Gs or Gi1,
  supported by mutagenesis and functional assays). Gnas ''part of adenylate cyclase-activating
  G protein-coupled receptor signaling pathway'' also has ISS from human GNAS (UniProtKB:P63092)
  based on Qiao 2020 (glucagon-induced Gs activation by NanoBiT, Fig 4I,K; glucagon-induced
  cAMP accumulation, Fig 4E,G). Chen 2005 (PMID:16239968) is not used on this fact:
  it measures blood glucose after glucagon (Fig 3A), not adenylyl cyclase activity
  or cAMP. Gcgr -> Gnas also keeps IMP PMID:16239968 (Chen 2005, liver-specific Gsalpha
  knockout mice lose the hyperglycemic response to glucagon, Fig 3A). Longuet 2008
  (PMID:19046568) uses exogenous glucagon only and does not show Gcg hormone activity
  or glucagon acting on Gcgr.'
- 'Input to AMPK (GO:0031588) (updated 2026-11-16). Glucagon reaches AMPK through
  Gcgr -> Gnas -> Adcy6 -> AMPK. Adcy6 (adenylate cyclase activity) -> AMPK uses ''causally
  upstream of, positive effect'' (RO:0002304) because the intervening steps are not
  modelled. Evidence: IC with GO:0070730 (cAMP transport), PMID:28515141 (Lv 2017,
  mouse primary hepatocytes): Ad-AC6 raises extracellular cAMP (Fig 2D-E); cAMP export
  via MRP4 is needed (probenecid, MRP4 RNAi, Fig 2F-I, 3C); extracellular cAMP raises
  AMPK phosphorylation (Fig 3A); 24 h glucagon raises AMPK phosphorylation (Fig 3B),
  reduced by AMPCP (5''-nucleotidase inhibitor) and NBTI (CNT2 adenosine transporter
  inhibitor) but not DPSPX (adenosine receptor antagonist) (Fig 3D; legend says cAMP-induced).
  Proposed route: exported cAMP -> AMP -> adenosine -> CNT2 uptake -> AMPK; PKA-independent
  but cAMP-dependent. IC because Lv never measures AMPK after manipulating AC6; readout
  is phosphorylation, not kinase activity. Glucagon increases AMPKalpha Thr172 phosphorylation
  in mouse primary hepatocytes (PMID:19046568, Longuet 2008, Fig 2A; immunoblot, no
  kinase assay), but the route is not resolved; a direct Gcgr -> AMPK edge carrying
  this IDA was removed on 2026-11-16 as redundant with the path above. Not modelled:
  lower hepatic energy state via gluconeogenesis/PEPCK-C (PMID:19662685, no mouse
  loss-of-function test); Ca2+/CaMKK2 not verified in liver. A PKA -> AMPK edge was
  removed on 2026-11-09: there is no loss-of-function evidence that PKA is needed
  for glucagon to activate hepatic AMPK; the PKA inhibitor H89 did not prevent glucagon''s
  AMPK-dependent effects (PMID:19046568, Fig 2C, 3B-C); Kimball 2004 (PMID:15494402,
  perfused rat liver) proposes PKA -> LKB1 -> AMPK by association only; and PKA phosphorylates
  AMPKalpha1 at Ser173 and inhibits its activation by LKB1 in mouse adipocytes (PMID:19942859).
  Limits: PKA independence rests on a single non-selective inhibitor (H89). Contrary
  evidence: glucagon did not change AMPK activity in mouse hepatocytes in PMID:32184359.'
- Palmitoylcarnitine start location for Slc25a20 (added 2026-11-16) = mitochondrial
  intermembrane space (GO:0005758), IC with GO:0005476, PMID:42223129, same pattern
  as the matrix end location. CPT1 active site faces the cytosol (Fraser 1997, PMID:9169604,
  rat liver); passage across the outer membrane (VDAC) is not modelled.
- 'Transcriptional arms (updated 2026-11-10). Creb1: PKA has input Creb1 and PKA ->
  Creb1 (directly positively regulates) = IDA PMID:23292513 (Miller 2013, Fig 2A-B:
  glucagon and the PKA agonist Sp-8-Br-cAMPS-AM induce CREB phosphorylation in mouse
  primary hepatocytes; PKA isoform not resolved, phospho-site not stated, no in-vitro
  kinase assay and no CREB transcriptional readout - activation of CREB by phosphorylation
  rests on Gonzalez & Montminy 1989, PMID:2573431, CREB Ser-133 in rat PC12 cells).
  Rat ISS (RGD:3389) removed from both edges on 2026-11-10. Louet 2002 (PMID:12107181,
  Fig 6) shows that PKA-Calpha and CREB both act on the L-CPT I promoter but not that
  PKA acts on CREB; Creb1 has input Cpt1a gene via the L-CPT I CRE and indirectly
  positively regulates Cpt1a (ISS rat Creb1 RGD:620218, PMID:12107181 Fig 6-7). Not
  modelled: Louet 2002 (Fig 5) shows that the cAMP-responsive unit of L-CPT I needs
  both the CRE (CREB) and a DR1 bound by HNF4alpha, with PGC-1alpha coactivating HNF4alpha
  (Fig 10C); the PGC-1alpha/HNF4alpha route was removed on 2026-11-06 because a requirement
  for PGC-1alpha was not tested (overexpression and timing only, rat hepatocytes).
  PPARalpha: AMPK -> PPARalpha ''directly positively regulates'' (Lv 2017 PMID:28515141,
  full text: AMPK consensus site Ser452; AICAR increases PPARalpha Ser/Thr phosphorylation
  in mouse hepatocytes, Fig 4B; constitutively active AMPK phosphorylates WT but not
  S452A PPARalpha in HEK293T/HepG2 cells, Fig 4C-D, and activates WT but not S452A
  PPARalpha in mouse hepatocytes, Fig 4E; cell-based, no in-vitro kinase assay, pan
  phospho-Ser/Thr antibody) -> Cpt1a (ISS human PPARA UniProtKB:Q07869, PPRE in CPT1A
  PMID:16271724; IMP PMID:28515141 Suppl Fig 4A-C, PPARalpha RNAi in mouse hepatocytes).
  PPARalpha is required for glucagon-stimulated fatty acid oxidation in mouse hepatocytes
  (IMP PMID:19046568 Fig 6D). Longuet 2008 (PMID:19046568) reports an AMPK -> p38
  MAPK -> PPARalpha route in mouse hepatocytes (Fig 2C, 5J-L); not modelled, the direct
  edge follows Lv 2017. Caveat: Louet 2002 reports that cAMP induction of L-CPT I
  is not abolished in PPARalpha-/- hepatocytes, so PPARalpha is not required for the
  cAMP/PKA transcriptional route. PKA cAMP/PKA signal transduction (GO:0141156) part
  of positive regulation of fatty acid beta-oxidation (added 2026-11-10): IC with
  GO:0001228 (downstream Creb1 transcription activator activity, part of GO:0032000),
  reference Louet 2002 (PMID:12107181, Fig 6: PKA-Calpha induces the L-CPT I promoter
  in rat hepatocytes); no PKA loss-of-function study with a hepatic FAO readout was
  found. A second, CREB-independent route is reported by Assali 2026 (PMID:42641876,
  full text): glucagon induces PKA-dependent NCLX Ser258 phosphorylation (human HepG2,
  H-89 sensitive, Fig 3B-C, 3G-H) and hepatocyte NCLX knockout blunts glucagon-stimulated
  lipolysis and FAO and raises CPT1 malonyl-CoA sensitivity in mice; H-89 was not
  tested on FAO; NCLX (Slc8b1) not modelled. Creb1 transcription activator activity
  part of positive regulation of fatty acid beta-oxidation (GO:0032000): IC with GO:0004095
  (Cpt1a carnitine O-palmitoyltransferase activity, which Creb1 indirectly positively
  regulates), reference Louet 2002 (PMID:12107181, Fig 6: CREB drives the cAMP response
  of the L-CPT I promoter); Louet measures CPT1 gene expression, not FAO; rat ISS
  (RGD:620218) on this fact replaced 2026-11-10.'
- 'cAMP/PKA trunk (updated 2026-11-10): Gcgr has input Gnas; Gcgr -> Gnas -> Adcy6
  -> cAMP -> PKA (Prkaca) -> Creb1 (see Transcriptional arms). Gnas has input Adcy6
  (added 2026-11-09): ISS from human GNAS (UniProtKB:P63092) based on Bhagirath 2022
  (PMID:35664968, human AC6 and Galphas in HEK293T: co-IP Fig 1C-D; AC6 cAMP response
  to constitutively active Galphas Fig 4D). Adcy6 is the hepatic isoform per Jia 2020
  (PMID:31918924, full text: liver-enriched adenylate cyclase in mouse primary hepatocyte
  RNA-seq, Fig 7B; induced by fasting, Fig 7F, and glucagon, Suppl Fig 2; ADCY6 protein
  in mouse primary hepatocytes, Fig 7C-D = basis of the hepatocyte IDA). Jia 2020
  has no Gs data, so Gnas -> Adcy6 (''has input Adcy6'' and ''directly positively
  regulates'' adenylate cyclase activity) is evidenced by ISS from human GNAS (UniProtKB:P63092),
  whose G protein activity is IDA PMID:17110384 (Gao 2007: purified constitutively
  active Galphas stimulates human AC6 adenylyl cyclase activity in Sf9 membranes,
  Fig 1D, 2B, and rat AC6, Fig 3B); Bhagirath 2022 (PMID:35664968) supports the same
  ISS (2026-11-10). cAMP measurements (PMID:23292513) are not isoform-resolved.'
