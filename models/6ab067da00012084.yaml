id: gomodel:6ab067da00012084
title: Slc18a3 and Ache regulate alpha4beta2-type nicotinic acetylcholine receptor
  activity at cholinergic synapses (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-11-02'
comments:
- Curated with GO AI HUB. Mouse Slc18a3 (VAChT) and Ache regulate alpha4beta2-type
  nAChR activity at cholinergic synapses; experimental source for ISS in the human
  models.
- Mouse source of the experimental evidence (PMID:16950158, PMID:25934969) transferred
  by ISS (GO_REF:0000024) to the SLC18A3 and ACHE causal edges in human models gomodel:6ab067da00011840
  and gomodel:6ab067da00011841.
