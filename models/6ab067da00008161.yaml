id: gomodel:6ab067da00008161
title: G-CSF signaling via JAK1-STAT3 in granulopoiesis (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-16'
comments:
- Curated with GO AI HUB. G-CSF (CSF3) signaling through CSF3R-JAK1-STAT3 driving
  granulocyte progenitor proliferation (C/EBPbeta-MYC) and neutrophil differentiation
  (p27Kip1), with SOCS3 negative feedback on CSF3R (Human).
- 'ISS sources (mouse, GO_REF:0000024): STAT3->Cebpb and C/EBPbeta->c-myc from PMID:20581311
  (ChIP, EMSA, luciferase in 32D.G-CSFR cells); STAT3->p27Kip1 (Cdkn1b) from PMID:10918585;
  STAT3->Socs3 from PMID:12150892; SOCS3 negative regulation from PMID:14975238. CAUTION:
  STAT3 induction of SOCS3 in the G-CSF context is the weakest edge (PMID:12150892
  abstract says ''possibly''); a better reference is welcome. No GO term exists for
  granulocyte progenitor proliferation; GO:0008284 used as a stand-in.'
