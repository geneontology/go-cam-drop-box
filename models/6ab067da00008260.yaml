id: gomodel:6ab067da00008260
title: GPR179 and RGS9BP organize RGS7/RGS11-Gbeta5 GAP activity on Galpha-o to enable
  TRPM1 gating in ON-bipolar cells_Visual Perception (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-23'
comments:
- Curated with GO AI HUB. GPR179 and RGS9BP anchor the RGS7/RGS11-Gbeta5 GAPs that
  deactivate Galpha-o, enabling TRPM1 opening in ON-bipolar cells.
- 'PROTOTYPE (curator design, 2026-10-19). GAP activities enabled_by RGS7 / RGS11
  (catalytic subunit known: GO-CAM complex guideline case 1); GNB5 isoform 2 (Gbeta5S)
  as its own molecular function activator activity (GO:0140677) upstream of each GAP;
  RGS9BP as protein-membrane adaptor activity (GO:0043495), as in production 6a18a9ba00000549
  / 6a2b236300000742. RGS7 / RGS11 GAP units (2026-10-23): ISS GO_REF:0000024 with
  mouse Rgs7 MGI:1346089 / Rgs11 MGI:1354739; basis Cao 2009 PMID:19625520 (Fig. 8
  GAP on Galpha-o; Figs. 1B, 3A tips) and Cao 2012 PMID:22547806 (Figs. 3-4 double
  KO, IGI; Figs. 1C, 2B tips), per-fact detail in each evidence comment.'
