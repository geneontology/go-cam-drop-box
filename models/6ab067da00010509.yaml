id: gomodel:6ab067da00010509
title: GPR179 positive regulation of TRPM1 channel gating in ON-bipolar cells_Visual
  Perception (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-23'
comments:
- Curated with GO AI HUB. GPR179 directly positively regulates TRPM1 channel gating
  at ON-bipolar dendritic tips.
- 'Model B of the two GPR179 models (curator design 2026-10-15). GPR179 ion channel
  regulator activity (GO:0099106) has_input TRPM1 and directly positively regulates
  the TRPM1 channel: Ray 2014 PMID:24790204 (Fig. 6 capsaicin-gated TRPM1 current
  reduced in nob5, normal in Rgs7/Rgs11 DKO, so independent of the RGS anchoring in
  Model A gomodel:6ab067da00008260; Fig. 3 direct interaction) and Orlandi 2013 PMID:24114537
  (human GPR179 x mouse TRPM1 co-IP; PLA in retina). Mouse data -> ISS GO_REF:0000024
  with MGI. Data are from rod bipolar cells; ON-bipolar cell CL:0000749 used to match
  Model A and the mega-viewer. Joins Model A and gomodel:6a6ba88c00000472 at TRPM1.'
