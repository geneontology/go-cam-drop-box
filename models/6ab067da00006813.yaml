id: gomodel:6ab067da00006813
title: Oxyntomodulin-GLP1R stimulated insulin secretion (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-14'
comments:
- 'Downstream cAMP units (added 2026-10-13, revised 2026-10-14): GLP1R -> GNAS (Gs)
  -> adenylate cyclase -> cAMP -> PRKACA and RAPGEF4/Epac2. Adenylate cyclase enabled
  by generic protein (PR:000000001): the ADCY isoform acting downstream of GLP1R in
  human beta cells is not established (ADCY5 couples glucose but not GLP-1 to insulin
  secretion in human islets, PMID:24740569; mouse Adcy8 KO, PMID:25403481, did not
  test GLP-1). Adenylate cyclase positively regulates PKA and Epac2 via cAMP (has
  output / has small molecule activator). Downstream steps not tested with OXM; several
  edges are ISS from mouse MGI orthologs.'
- 'Insulin: native OXM infusion increased glucose-dependent insulin secretion rate
  in obese humans with and without T2DM (PMID:29545266, abstract only) -> IDA on the
  OXM pathway; GLP1R pathway part of GSIS and GLP1R in beta-cell plasma membrane are
  IC. GLP1R-dependence of OXM-stimulated insulin secretion shown in mouse Glp1r-/-
  islets and INS-1 cells (PMID:18669601, abstract only), not used as evidence in this
  human model.'
- 'Not modelled: beta-arrestin 1/2 and GRK2 recruitment and arrestin contribution
  to pERK1/2 (PMID:17395766, 27315480, 38360293); OXM reduction of beta-cell apoptosis
  (PMID:18669601); OXM action on GCGR. Upstream OXM production by L cells: see gomodel:6ab067da00005905.'
- 'OXM enabler = GCG peptide chain UniProtKB:P01275-PRO_0000011255 (aa 53-89). OXM->GLP1R
  IDA from cAMP and BRET assays in GLP-1R-expressing cells (PMID:27315480 full text;
  PMID:17395766). GLP1R part of AC-activating GPCR pathway: OXM cAMP blocked by adenylyl
  cyclase inhibitors (PMID:27315480, Fig S1).'
