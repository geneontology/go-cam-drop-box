id: gomodel:6ab067da00007273
title: Positive regulation of gluconeogenesis by glucagon/GCGR (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-27'
comments:
- '2026-10-13: upstream units (glucagon, GCGR, GNAS, ADCY6, PKA) moved from part_of
  GO:0007189 to part_of GO:0045722 ''positive regulation of gluconeogenesis'' (curator
  choice; one BP per activity, matching CRTC2/CREB1). Evidence (abstracts only): glucagon
  ISS MGI:95674 (PMID:24051374 MGI IDA; PMID:20592160 glucagon loss reduces hepatic
  glucose production). GCGR IDA PMID:35767325 (glucagon/GCGR induces PCK1 in Huh-7-Lunet
  cells with epitope-tagged GCGR, and PCK1/PGC1a/G6PC in primary hepatocytes via endogenous
  GCGR; receptor and hepatocyte species not stated in abstract - check full text)
  + ISS MGI:99572 (PMID:12552113 Gcgr-/- lower blood glucose). GNAS ISS MGI:95777
  (PMID:16239968 liver-specific Gsa KO: low hepatic gluconeogenic enzyme expression
  when fed; fasting glucose normal). ADCY6 ISS MGI:87917 (PMID:31918924, INDIRECT:
  Purb raises Adcy6 transcription and glucagon-driven glucose production; no direct
  Adcy6 loss-of-function). PKA ISS MGI:97592 (PMID:23292513 MGI IDA: metformin lowers
  cAMP/PKA and blocks glucagon-dependent glucose output in mouse hepatocytes; pharmacological).'
- Built by claude4go with curator 2026-10-13 as the glucagon counterpart of gomodel:6ab067da00006950
  (OXM/GCGR). Same hepatocyte cascade (GCGR -> Gs -> ADCY6 -> cAMP -> PKA -> CREB1/CRTC2
  -> PCK1, G6PC1); only the ligand unit differs. Mostly abstract-level evidence; full
  texts not read.
- 'GNAS->ADCY6: human ADCY6 activated by Galpha-s in vitro (PMID:17110384, abstract;
  Gs species not stated) -> IC. ADCY6 choice for hepatocyte: mouse glucagon/ADCY6/cAMP/PKA/CREB
  pathway in hepatocytes (PMID:31918924).'
- 'Glucagon->GCGR: glucagon peptide UniProtKB:P01275-PRO_0000011256 (aa 53-81). IDA
  PMID:9287038 (human GCGR expressed in CHO cells; glucagon binding, cAMP accumulation
  and Ca2+ mobilization; abstract). Glucagon species not stated in the abstract, but
  the peptide is identical in human, rat and mouse. GCGR part_of hepatocyte now cites
  PMID:31918924 (mouse glucagon/GCGR/PKA pathway in hepatocytes) instead of the OXM
  paper used in the OXM model.'
- 'PKA->CREB1 Ser133: PMID:2573431 (rat PC12) -> ISS RGD. CRTC2: mouse TORC2 regulates
  fasting gluconeogenic CREB transcription (PMID:16148943) -> ISS MGI. CREB1->PCK1/G6PC1:
  mouse CREB mutants reduce gluconeogenic gene expression (PMID:11557984) -> ISS MGI;
  note that in that study CREB acts largely via PGC-1 (not modelled). Not modelled:
  PKA-SIK2 control of CRTC2, CBP/p300, PGC-1alpha.'
