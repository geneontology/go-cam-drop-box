id: gomodel:6ab067da00011397
title: Nociceptor-derived Reg3g suppresses the microglial kynurenine pathway and protects
  neuronal ATP production in endotoxemia (Mouse)
taxon: NCBITaxon:10090
status: production
date_modified: '2026-10-26'
comments:
- Curated with GO AI HUB. Nociceptor-derived Reg3g suppresses the microglial kynurenine
  pathway, lowering quinolinate and preserving c-Src-dependent HK1 phosphorylation
  and neuronal ATP production during endotoxemia (PMID:35263589).
- Quinolinate (CHEBI:29959) is not the direct product of any activity in this model.
  HAAO outputs cis,cis-2-amino-3-carboxymuconate 6-semialdehyde (CHEBI:77612, RHEA:17953),
  which cyclises to quinolinate spontaneously. There is no enzyme and therefore no
  activity unit for that step; the quinolinate node represents its product, and the
  HAAO -> SRC causal edge carries the biology (PMID:35263589 Fig. 3I, S4A-S4E).
- XIAP is modelled with signaling adaptor activity (GO:0035591). PMID:35263589 shows
  only that EXTL3 binds XIAP and XIAP binds BCL10 (Fig. 6C) and that XIAP knockdown
  abolishes the Reg3g effect (Fig. 6D). The function is inferred from binding plus
  knockdown; XIAP's established MF is E3 ubiquitin ligase activity, which this paper
  does not test in this pathway.
