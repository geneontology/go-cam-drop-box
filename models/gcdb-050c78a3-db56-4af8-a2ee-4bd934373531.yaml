id: gomodel:gcdb-050c78a3-db56-4af8-a2ee-4bd934373531
title: AMPA receptor transport to postsynaptic membrane (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-09-24'
comments:
- 'Evidence: ECO codes and PMIDs are taken verbatim from the claim evidence rows. Rows marked in the proposal as
  known-wrong (ECO:0001585 on shRNA work in STX-41, SYT-35, SYT-37) were omitted; author-statement rows and rows
  without a PMID were not used as evidence.'
- 'Model A, AMPAR secretory route and synaptic insertion (modules 02+03). Built on noctua-dev from the GO-CAM tab
  of ROUTE_INVENTORY.html (proposal of 2026-09-23) and CLAIMS_ALL.md. 19 activity units, 20 causal edges, 3 small-molecule
  links. Unit status (ready/proposed/decide) and claim IDs are in the comment on each activity; each evidence individual
  names its claim. Not yet signed off by the expert pair (meeting 2026-09-29). Open decisions: receptor meets gamma-8;
  VAMP2 node; SNAP23 boundary; 4.1N node; NSF owner; JNK3 molecular function; second partner of the SAP97 adaptor;
  insertion site.'
- 'Status is development on purpose: the model awaits the expert review of 2026-09-29 and will receive additions
  and changes. Not ready for merge.'
- '2026-09-24: calcium collapsed to a single CHEBI:29108 node with three "is small molecule activator of" edges
  (Myo5b, Syt1, Syt7); the spurious has-input calcium edges of the first submission were removed.'
- Figure panels per evidence line (gocam-py evidence items have no comment slot, so the panels from the evidence
  rows of CLAIMS_ALL.md are carried here; the same text is on each evidence individual in the noctua-dev model gomodel:6ab067da00000569).
