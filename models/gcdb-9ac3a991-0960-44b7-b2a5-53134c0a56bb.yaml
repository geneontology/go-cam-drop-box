id: gomodel:gcdb-9ac3a991-0960-44b7-b2a5-53134c0a56bb
title: mGluR6-G(o)(GNAO1/GNB3/GNG13)-TRPM1 ON bipolar cascade_Visual Perception (Human)
taxon: NCBITaxon:9606
status: production
date_modified: '2026-09-17'
comments:
- '2026-09-15: De-entangled activity context so VPE renders all causal edges. Gave
  Go(GNAO1), Gbeta-gamma-adaptor, TRPM1, and Gbeta-gamma-channel-regulator activities
  their own plasma membrane + GO:0007216 + GO:0007601 instances (previously all five
  activities shared one plasma-membrane and one pathway instance, which collapsed
  them in VPE and hid the pos-reg/neg-reg edges). GRM6 kept on original context. Causal
  wiring unchanged.'
- claude4go build 2026-08-17; touch to trigger store/index
