id: gomodel:6ab067da00015551
title: Lactate is imported into the cytosol by Slc16a1 and then converted into pyruvate
  by Ldha before import into the mitochondria by Mpc1 (Mouse).
taxon: NCBITaxon:10090
status: development
date_modified: '2026-11-16'
comments:
- 'Curated with GO AI HUB. The classic cytosolic route in mouse, modelled generally
  rather than tissue-restricted: Slc16a1 imports lactate to the cytosol, Ldha oxidises
  it to pyruvate, and Mpc1 carries that pyruvate into the mitochondrial matrix.'
