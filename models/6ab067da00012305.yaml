id: gomodel:6ab067da00012305
title: FGF23-KL-FGFR1 signaling in kidney proximal tubule (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-10-30'
comments:
- 'Built from UniProt FGF23 (Q9GZV9/Q9EPC2) curation and PMID:22647968 (full text),
  PMID:21908609, PMID:19515808, PMID:15040831. FGF23 effects on CYP27B1/CYP24A1 are
  linked from the hormone activity because the receptor mediating them was not tested
  in the cited paper. SGK1->NHERF1 is ''causally upstream of, negative effect'': SGK1-dependent
  NHERF1 Ser phosphorylation shown with inhibitor, direct phosphorylation not shown.
  FGFR4 (minor role, PMID:19515808) and heparan sulfate cofactor (PMID:29342138) not
  modelled.'
