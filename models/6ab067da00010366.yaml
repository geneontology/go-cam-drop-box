id: gomodel:6ab067da00010366
title: PTEN in excitatory hippocampal synapse long-term depression (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-22'
comments:
- 'Curated with GO AI HUB. Revised version of gomodel:62900b6400001630 (PTEN in NMDAR-dependent
  LTD) following review of 2026-10-22: ISS evidence moved to GO_REF:0000024 with RGD/MGI
  orthologs; PTEN-to-beta-catenin edge moved to a separate PTEN unit (PDZ-binding-motif
  role, PMID:33428810); SLC6A20 negatively regulates NMDAR via glycine clearance.'
- 'PTEN lipid phosphatase activity (GO:0016314) is drawn causally upstream of, negative
  effect, CTNNB1 at the curator''s choice. Caveat: Bae 2021 (PMID:33428810) PtenDeltaC
  lacks the PDZ-binding motif but keeps normal AKT/mTOR phosphorylation (Fig EV1G)
  and still shows more nuclear beta-catenin (Fig 2D, 2F), so the effect may not need
  the phosphatase activity.'
