id: gomodel:6ab067da00008005
title: Autophagosome assembly via ER-anchored ATG2B lipid transfer (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-19'
comments:
- 'Curated with GO AI HUB. ATG2B transfers PE from the ER to the phagophore (PMID:31721365,
  PMID:42842923). MOSPD1 and MOSPD3 each recruit ATG2B to the ER via its FFNT motif,
  but autophagic flux requires both (single KOs impaired; DKO rescued only by co-expression;
  PMID:42842923); they self-associate and hetero-associate via their transmembrane
  regions (PMID:33296653), so the ER adaptor is captured as a MOSPD1-MOSPD3 complex.
  Placeholder: GO:0098796 membrane protein complex, pending a GO term request for
  ''MOSPD1-MOSPD3 complex''. WDR45/WIPI4 stimulates ATG2B lipid transfer (PMID:31721365);
  TRAPPC11 is required for recruitment of ATG2B-WIPI4 to isolation membranes (PMID:30843302).'
