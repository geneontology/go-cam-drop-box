id: gomodel:gcdb-40495a6a-7b39-41f1-bcb5-7f83e3547901
title: FOXO-CDKN1B signaling (HUMAN)
taxon: NCBITaxon:9606
status: production
date_modified: '2026-07-28'
comments:
- 'Curated by claude4go (v3). Rebuild of v2 (gomodel:6a4e740f00000205) to also give
  every activity its OWN part_of BP individual and occurs_in CC individual (no shared
  context instances), extending the distinct-individuals-per-activity-unit rule beyond
  has_input/enabled_by. Spine: IGF1R>PI3K>AKT (PMID:19951971,TAS) -| FOXO4 (PMID:10217147);
  FOXO4/FOXO3 activate CDKN1B/p27 -> G1/S arrest (PMID:10783894,PMID:18393360); c-Myc
  corepressor -| FOXO3 (PMID:18393360). SCP4/CTDSPL2 dephosphorylates/activates FOXO1/FOXO3
  (PMID:28851713). FOXO1 -> G6PC1,PCK1 (PMID:28851713); PGC-1a coactivator -> G6PC1
  parallel arm (PMID:17024043, argues PGC-1a effect on G6Pase is independent of FOXO1).
  AS160/TBC1D4 (PMID:11994271) peripheral AKT substrate, per curator request.'
