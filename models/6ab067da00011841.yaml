id: gomodel:6ab067da00011841
title: (CHRNA4)2:(CHRNB2)3 nicotinic acetylcholine receptor in the cholinergic synapse
  acetylcholine cycle (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-02'
comments:
- 'Curated with GO AI HUB. (CHRNA4)2:(CHRNB2)3 nAChR in the cholinergic synapse acetylcholine
  cycle: VAChT loading and ACHE hydrolysis regulating the channel.'
- Replaces stoichiometry test models gomodel:67369e7600003097, 67369e7600003173, 67369e7600003135
  ((CHRNA4)2:(CHRNB2)3). Both Na+ and Ca2+ captured on one channel activity. No Ca2+
  potentiation for this stoichiometry (PMID:38454578).
