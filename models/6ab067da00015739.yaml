id: gomodel:6ab067da00015739
title: In heart, SLC16A1 directly transports lactate into mitochondria for conversion
  to pyruvate by LDHB, fueling the electron transport chain (Human).
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-16'
comments:
- 'Curated with GO AI HUB. Human counterpart of gomodel:6ab067da00015433: SLC16A1
  and LDHB in the cardiomyocyte mitochondrial lactate oxidation route. Activity assertions
  are ISS from the mouse orthologs; IDA is used only for the localisation and cell
  context that PMID:42951956 shows for the human proteins.'
- 'Curation notes: (1) LDHB ''enabled by'' GO:0004459 is IDA PMID:27618187 (Nat Chem
  Biol 2016, mitochondrial lactate metabolism in human cells), NOT a transfer: the
  enzymatic activity of human LDHB is directly known, and human LDHB also holds this
  term by EXP PMID:11276087. (2) The ISS sources are the mouse experimental data of
  PMID:42951956 itself, captured in gomodel:6ab067da00015433; MGI does not yet carry
  standard annotations for mitochondrial MCT1 or matrix LDHB, so the mouse GO-CAM
  is the source of record. (3) MCT1 uses GO:0015129, not the child GO:0015650, because
  proton coupling at the inner mitochondrial membrane is not tested; human SLC16A1
  holds GO:0015650 by IDA at the PLASMA membrane (PMID:12946269), a different activity.
  (4) Human LDHB''s existing localisation annotation is mitochondrial inner membrane
  (IDA PMID:27618187); this model places it in the matrix, following the proteinase
  K data in PMID:42951956 Fig 3b. (5) Human SLC16A1 has no prior mitochondrial annotation;
  the inner-membrane localisation is new with PMID:42951956.'
- 'EVIDENCE POLICY. PMID:42951956 establishes this mechanism in MOUSE. Its human experiments
  demonstrate LOCALISATION, not activity, so IDA is used only for localisation and
  cell context; every activity and transport assertion for the human proteins is ISS
  (ECO:0000250, GO_REF:0000024) with the mouse ortholog in with/from. IDA PMID:42951956:
  MCT1 ''occurs in'' mitochondrial inner membrane, and the cardiac muscle cell / heart
  context - from Fig 3a (MCT1 in mitochondrial fractions of human donor and failing
  hearts), Extended Data Fig 6a-d (MCT1 immunoprecipitated from human cardiac mitochondria,
  recovering mitochondrial and not plasma-membrane markers), Fig 3c (proteinase K
  protection on human hearts) and Extended Data Fig 2j (human snRNA-seq: SLC16A1 predominantly
  in cardiomyocytes). ISS with:MGI:MGI:106013 - MCT1 lactate transmembrane transporter
  activity, the cytosol-to-matrix lactate input and output, and the process. The paper
  does NOT demonstrate lactate transporter activity for human SLC16A1: the human functional
  experiment (Fig 3n) is a small-molecule MCT1-inhibitor treatment of purified human
  cardiac mitochondria, which shows the import is MCT1-inhibitor-sensitive but does
  not assay the human protein, so attributing the activity to SLC16A1 from it would
  rest on the inhibitor''s selectivity rather than on direct evidence. ISS with:MGI:MGI:96763
  - the entire mitochondrial context of LDHB (matrix localisation, lactate input,
  pyruvate and NADH outputs, process, cell context); the human panels do not attribute
  these to LDHB specifically, and the pan-LDH inhibitor experiment (Fig 3m) is mouse.'
- Human counterpart of gomodel:6ab067da00015433 (Mouse). MCT1/SLC16A1 imports lactate
  across the inner mitochondrial membrane of cardiomyocytes; matrix LDHB oxidises
  it to pyruvate + NADH, feeding the electron transport chain in parallel to the canonical
  MPC/pyruvate route. The mitochondrial lactate individual is shared between the MCT1
  'has output' and the LDHB 'has input' (handoff), so 'provides input for' is inferred
  and not materialised.
