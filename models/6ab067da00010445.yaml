id: gomodel:6ab067da00010445
title: Negative regulation of Ros1 signaling by Ptpn6 in epididymis (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-10-23'
comments:
- 'Curated with GO AI HUB. Mouse corrected copy of gomodel:65d7e4ac00000470 (PTPN6
  negatively regulates ROS1), with direct evidence from Keilhack et al. 2001 (PMID:11266449):
  Ros hyperphosphorylation in me(v) Ptpn6-mutant epididymis (Fig 3), SHP-1 N-SH2 binding
  to Ros pY2267 and Ros dephosphorylation (Figs 4-5), SHP-1 suppression of TrkA-Ros
  proliferation in NIH3T3 (Fig 6).'
