id: gomodel:6ab067da00000385
title: GOLPH3-dependent intra-Golgi recycling of glycosphingolipid synthases (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-20'
comments:
- '2026-10-20: PI4KB activity unit removed (no paper shows PI4KB acting on GOLPH3;
  link rested on inhibitor/yeast data). Replaced by PI4P (CHEBI:58178) ''is small
  molecule activator of'' GOLPH3 cargo adaptor activity (IMP: Golgi PI4P depletion
  and PI4P-binding mutants, PMID:19837035; R90L and PIK93, PMID:42276998), PI4P located
  in GO:0160288 (IC).'
- 'Built by claude4go 2026-09-23 from Rizzo et al 2021 EMBO J (PMID:33749896): GOLPH3
  binds the LxxR cytosolic tails of B4GALT5, A4GALT, ST3GAL5 and ST8SIA1 and recycles
  them in COPI vesicles from the trans cisterna (cryo-IEM, RUSH), retaining them in
  the Golgi and preventing lysosomal degradation; GOLPH3 KD/OE lowers/raises LacCer,
  Gb3, GM3 output. Cargo adaptor MF also from Welch et al 2021 (PMID:34473204). PI4KB
  (1-phosphatidylinositol 4-kinase activity) directly positively regulates GOLPH3
  by generating the trans-Golgi PI4P pool that recruits it (Dippold 2009 PMID:19837035;
  PI4KIIIbeta named as the kinase by Rizzo 2021); per project convention the kinase
  reaction itself (PI -> PI4P) is not described. GOLPH3->client edges are ''indirectly
  positively regulates'' (IMP): GOLPH3 controls client localisation and level, not
  catalysis. Trans-cisterna location is direct (IDA) for B4GALT5 only; inferred (IC)
  for the three co-clients and for the lumenal location of GlcCer/LacCer/Gb3/GM3/GD3
  (with Lannert 1998 PMID:9446606). Downstream Gb3->Akt/mTOR mitogenic signalling
  deliberately left out (mechanism unresolved).'
- Curated with GO AI HUB. GOLPH3, a COPI cargo adaptor recruited by PI4P, retains
  the glycosphingolipid synthases B4GALT5, A4GALT, ST3GAL5 and ST8SIA1 in the trans-Golgi,
  controlling LacCer, Gb3, GM3 and GD3 synthesis (Rizzo 2021).
