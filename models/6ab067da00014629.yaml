id: gomodel:6ab067da00014629
title: Vascular smooth muscle relaxation by CALCB/beta-CGRP (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-11'
comments:
- 'Built 2026-11-11 from skeleton gomodel:66a3e0bb00001742 (CALCB -> CALCRL-RAMP1
  -> GNAS -> ADCY6 -> cAMP), recast in the target cell: vascular associated smooth
  muscle cell (CL:0000359), with the CGRP receptor signaling pathway part of relaxation
  of vascular associated smooth muscle (GO:0060087, is_a vasodilation). The CGRP receptor
  is modelled as GO:1990406 (CALCRL+RAMP1) enabling the activity, since the peptide-binding
  site is shared by both subunits (PMID:30209400).'
- Curated with GO AI HUB. Beta-CGRP (CALCB) signaling via the CALCRL-RAMP1 CGRP receptor,
  Gs, adenylate cyclase, cAMP, PKA and the SUR2B/Kir6.1 KATP channel in relaxation
  of vascular smooth muscle (Human).
- 'Downstream arm added 2026-11-11: cAMP -> PRKACA (cAMP-dependent protein kinase)
  -> SUR2B (ABCC9 isoform O60706-2, potassium channel regulator activity) -> Kir6.1
  (KCNJ8) K_ATP channel, K+ efflux, hyperpolarization and relaxation of vascular smooth
  muscle. CGRP -> PKA -> K_ATP currents shown in rabbit mesenteric (PMID:8189394)
  and pig coronary (PMID:9490826) arterial myocytes; human placental vessel relaxation
  to CGRP blocked by Rp-cAMPS and glibenclamide (PMID:14684361); human iPSC-VSMC K_ATP
  currents (PMID:38984978). Direct PKA phosphorylation of SUR2B Ser1387 activating
  Kir6.1/SUR2B shown with rat Kir6.1 + mouse SUR2B clones (PMID:17596331, PMID:18198173;
  also PMID:15087422), so those edges are ISS (GO_REF:0000024) from MGI:MGI:1352630
  / RGD:2960. Alternative Gbetagamma -> Kv7/BKCa route (human coronary, PMID:38583945;
  rat, PMID:42157312) not modelled.'
- 'Evidence caveat: human beta-CGRP relaxes human arteries endothelium-independently
  (PMID:14642788, PMID:3495374, PMID:15983761), but the cAMP dependence of CGRP vasorelaxation
  varies by vascular bed: AC/PKA inhibitors reduce it in human thymic arteries (PMID:12529288),
  whereas in human coronary arteries it is AC/PKA-independent and Gbetagamma-dependent
  (PMID:38583945). The AC isoform in vascular smooth muscle downstream of the CGRP
  receptor is not established; ADCY6 is kept from the skeleton. Downstream effectors
  of cAMP (PKA, K+ channels) are deliberately not modelled. Several references were
  evaluated from abstracts only (no PMC full text): 14642788, 3495374, 11804624, 12529288,
  17916776, 17110384, 12135370, 1318039.'
