id: gomodel:6ab067da00012429
title: FGF23-FGFR3 signaling in osteoblast mineralization (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-10-30'
comments:
- Built from UniProt FGF23 (Q9EPC2) curation and PMID:26235988, read as ABSTRACT ONLY
  (no open full text), hence EXP evidence; FGFR3-ERK1/2 step taken from the UniProt
  annotation of that paper and should be verified against full text. Osteopontin MF
  unknown (root MF, ND). Klotho-independent. Rat calvaria data (PMID:18282132, FGFR
  TK-dependent suppression of osteoblast differentiation) not used in this mouse model.
