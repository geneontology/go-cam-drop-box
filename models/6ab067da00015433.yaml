id: gomodel:6ab067da00015433
title: In heart, Slc16a1 directly transports lactate into mitochondria for conversion
  to pyruvate by Ldhb, fueling the electron transport chain (Mouse).
taxon: NCBITaxon:10090
status: development
date_modified: '2026-11-16'
comments:
- Built from PMID:42951956 (Cluntun et al., Nature 659:523-531, 2026). MCT1 (Slc16a1)
  imports lactate across the inner mitochondrial membrane; matrix LDHB oxidises it
  to pyruvate + NADH, feeding the ETC in parallel to the canonical MPC/pyruvate route.
  The mitochondrial lactate individual is shared between the MCT1 'has output' and
  the LDHB 'has input' (handoff), so 'provides input for' is inferred and not materialised.
- 'Caveat on LDHA directionality: GO:0004459 is written as the reversible reaction,
  and direction here is expressed by has input (lactate) / has output (pyruvate).
  Note that LDHA kinetically favours the reverse direction (pyruvate -> lactate);
  PMID:42951956 itself notes the lower Km of LDHB for pyruvate favours forward lactate
  oxidation. The cytosolic LDH step is modelled with LDHA as the conventional-model
  enzyme (Fig 1a of that paper), but LDHB or a generic LDH may be the better enabler
  for net lactate oxidation.'
- 'Curated with GO AI HUB. Mitochondrial lactate shortcut in mouse heart: Slc16a1
  carries lactate across the inner mitochondrial membrane to matrix Ldhb, which oxidises
  it to pyruvate + NADH (PMID:42951956).'
- 'Curation notes: (1) MCT1 MF uses GO:0015129 (lactate transmembrane transporter
  activity) rather than the child GO:0015650 (lactate:proton symporter activity) because
  this paper does not test proton coupling at the IMM; GO:0015650 is already held
  by Slc16a1 via IBA/ISS. (2) MPC is an obligate MPC1/MPC2 heterodimer but has no
  ComplexPortal entry, so the pyruvate transport unit is enabled by Mpc1 alone. (3)
  MPC1 ''occurs in'' mitochondrial inner membrane is IDA from mitochondrial fractionation
  (Figs 1j, 2c); the IMM granularity leans on established prior knowledge. (4) Heart-failure,
  TAC and ischemia-reperfusion phenotypes are organism-level consequences and are
  deliberately not modelled as activities.'
- 'Cytosolic route added 2026-11-12: plasma-membrane MCT1 (Slc16a1) imports extracellular
  lactate into the cytosol; cytosolic LDHA oxidises it to pyruvate + NADH; that pyruvate
  is the same individual MPC1 imports into the matrix (handoff chain PM-MCT1 -> LDHA
  -> MPC1). IMPORTANT: these two units are NOT referenced to PMID:42951956. That paper
  reports the opposite for cardiomyocytes - cytosolic lactate uptake and pyruvate
  production were UNAFFECTED by loss of MCT1 (Fig 2d,e), and tissue lactate/pyruvate
  enrichment was unchanged, which is how the authors isolate the mitochondrial role
  from the plasma-membrane one. The PM unit is therefore evidenced by PMID:29026134
  (MCT1 knockdown reduces plasma-membrane lactate flux, mouse adipocytes) and the
  LDHA unit by PMID:21041631 and PMID:17572440. Only the cardiomyocyte/heart context
  of the PM unit cites PMID:42951956.'
