id: gomodel:6ab067da00008083
title: Fatty acid beta-oxidation via PISD-tethered lipid droplet-mitochondrion contacts
  (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-19'
comments:
- 'Curated with GO AI HUB. PISD isoform 2 (PISD-LD, UniProtKB:Q9UG56-2) on lipid droplets
  and PISD isoform 1 (PISD-M, UniProtKB:Q9UG56-3) on the mitochondrial outer membrane
  tether LDs to mitochondria independently of decarboxylase activity and recruit ATG2A/ATG2B,
  which are required for fatty acid transport from LDs to mitochondria for beta-oxidation;
  PISD-LD restrains SPART-mediated lipophagy by competing with LC3A/C (PMID:42439896).
  ATG2A/ATG2B lipid transfer activity is captured without a substrate: fatty acid
  cargo is inferred from tracer retention and reduced FAO after ATG2A/B double knockdown,
  not from a transfer assay. Placeholder terms pending GO term requests: GO:0140177
  membrane-membrane adaptor activity (for ''lipid droplet-mitochondrion tether activity''),
  GO:0044232 organelle membrane contact site (for ''lipid droplet-mitochondrion contact
  site'').'
