comments:
- 'Built by claude4go. v2 mouse rebuild of FOXO-CDKN1B signaling, structure per human
  v3 (gomodel:6a4e740f00000268), mouse orthologs & per-edge evidence per mouse model
  gomodel:6a4e740f00000912. Rebuilt clean from scratch: the two orphan gene-product
  individuals in 912 (a duplicate Akt1 and an orphan Foxo1) were NOT reproduced. ISS
  transfers carry with/from (HNF4A arm -> rat RGD:2810; AKT spine & FOXO transfers
  -> human orthologs). AKT spine curated as ISS (transferred).'
