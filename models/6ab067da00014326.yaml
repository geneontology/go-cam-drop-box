id: gomodel:6ab067da00014326
title: Negative regulation of IGF1R signaling by STC2 (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-11'
comments:
- Curated with GO AI HUB. STC2 covalent inhibition of PAPPA blocks IGFBP4 proteolysis
  and IGF1 release, negatively regulating IGF1R signaling (Human).
- 'STC2 inhibits PAPPA by forming a covalent 2:2 complex (STC2 Cys120 disulfide) that
  blocks IGFBP4 binding at an exosite; the active site stays accessible (PMID:25533459,
  36257932, 36550107; full texts). Modelled as metalloendopeptidase inhibitor activity
  although the inhibition is covalent (disulfide), not catalytic modification. STC2
  also inhibits PAPPA2 (PMID:26195635); PAPPA2 arm effect on IGF1R signaling inferred
  (IC). IGF1R assay: 293-IGF1R cells, PMID:25533459. IGFBP5 sequestering is IC (PMID:10766744,
  abstract only). Not modelled: UPR/PERK-ATF4 induction of STC2 (PMID:15485913). Built
  by claude4go from Swiss-Prot PAM_STC1.log.'
