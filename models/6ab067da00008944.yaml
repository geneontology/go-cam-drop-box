id: gomodel:6ab067da00008944
title: Glucagon processing in pancreatic A cell (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-28'
comments:
- '2026-10-19 claude4go: Human model; rodent evidence transferred as ISS (GO_REF:0000024,
  MGI/RGD with/from). Source papers per edge listed in curator file P2GO-rodent-annotations-for-ISS.md:
  Pax6 rat PMID:20592023, 22778220, 17901057; Mafb mouse PMID:16443760, 29378833;
  7B2/Scg5 mouse PMID:10089884, 22013069; Pcsk2 mouse PMID:11356850, 7730317, 40971442;
  Cpe mouse PMID:11375130. Abstract-level reading only.'
- '2026-10-20 ISS replaced by human experimental evidence where found: SCG5 activity
  occurs in secretory granule, and that granule part of pancreatic A cell -> IDA PMID:1466150
  (Azzoni 1992, human pancreas; immuno-EM localises 7B2 to islet secretory granules,
  strongest in the peripheral halo of alpha granules; note the authors argue 7B2 is
  unrelated to intracellular prohormone processing, so this reference supports the
  localisation only). PCSK2 granule part of pancreatic A cell -> IDA PMID:32291281
  (Ramzy 2020, immunofluorescence with validated antibodies: PC2 immunoreactivity
  present in human alpha cells, absent in beta cells). Both read at abstract level
  only. PAX6, MAFB and CPE edges remain ISS: no human experimental data found.'
- '2026-10-20 PMID:9287128 (Rouille 1997, full text read): Fig 3, adenoviral PC2 +
  Syrian hamster proglucagon in GH4C1 (rat pituitary) cells yields mature glucagon
  only with PC2; Fig 4, purified recombinant PC2 + CPE convert synthetic human oxyntomodulin
  to glucagon (CPE alone: no conversion; no PC2-alone lane). Enzyme species not stated
  (gifts from Lindberg / Fricker), so used as IC on human PCSK2/CPE facts, not IDA/ISS.'
- '2026-10-28 CPE enabled by: mouse ISS replaced by IDA PMID:11462236 (Chen 2001 Hum
  Mutat: wild-type and R283W human CPE cleave peptide substrates; enzyme kinetics
  and pH profile). Abstract-level reading only; substrates are not glucagon. Other
  CPE edges and PCSK2 granule/input/process edges remain ISS (no human data found;
  PMID:8916141 pending full-text check for human immuno-EM of PC2 in alpha granules).'
- '2026-10-28 MAFB: ISS replaced by human evidence. MAFB nucleus part of pancreatic
  A cell -> IDA PMID:34428183 (Shrestha 2021, IHC of non-diabetic human pancreas,
  MAFB in GCG+ alpha cells, Fig 1E/4D; nuclear localisation not stated explicitly
  in text). MAFB part of GO:0045944 and has input GCG -> IMP PMID:32488111 (Russell
  2020, MAFB-/- hESC differentiated to alpha-like cells: fewer GCG+ cells, reduced
  GCG mRNA and glucagon content, ARX/PAX6 unchanged, Fig 6; caveat: confounded by
  an alpha-cell differentiation defect, and GCG is not among MAFB ChIP-seq targets
  reported there). PAX6: no human IDA/IMP found for alpha cells or GCG (PMID:27941241
  shows PAX6 represses GCG in human beta cells); PAX6 edges remain ISS.'
- '2026-10-28: added PMID:25811241 (Ramos-Molina & Lindberg 2015, full text). FAM20C
  (human) phosphorylates 7B2 at Thr73/Thr111 (IDA, human 7B2 in HEK cells, Fig 6A);
  phosphomimetic T111E (rat 7B2) reduces activation of human proPC2 in human SK-N-MC
  cells (IMP, Fig 5A) -> FAM20C directly negatively regulates SCG5. Human 7B2 required
  for human PC2 activity in SK-N-MC (Fig 5B/6B) -> IDA replaces mouse ISS on SCG5
  enabled_by and SCG5 -> PCSK2. Not studied in alpha cells or islets: FAM20C Golgi
  part_of A cell is IC (curator decision). Ala100-lacking 7B2 splice variant activates
  proPC2 less efficiently (not modelled as an isoform).'
- 'Caveats: (1) FOXA2 not modelled: rat G2 Foxa site not conserved in human (PMID:15828872).
  (2) CPE part_of pancreatic A cell is IC: no A cell-specific CPE localization paper
  found. (3) CPE has_input is GCG (P01275) standing for the PC2 product glucagon-Lys-Arg;
  no UniProt chain for it. (4) Some ISS sources (e.g. mouse Scg5 GO:0016504, secretory
  granule) are not yet in GOA; pending P2GO entry by curator.'
