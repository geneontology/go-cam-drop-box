id: gomodel:6ab067da00006950
title: Positive regulation of gluconeogenesis by OXM/GCGR (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-27'
comments:
- '2026-10-13: GCGR, GNAS, ADCY6, PKA moved from part_of GO:0007189 to part_of GO:0045722
  ''positive regulation of gluconeogenesis'', same evidence as the glucagon model
  gomodel:6ab067da00007273 (see its comment: GCGR IDA PMID:35767325 + ISS MGI:99572;
  GNAS ISS MGI:95777 PMID:16239968; ADCY6 ISS MGI:87917 PMID:31918924, indirect; PKA
  ISS MGI:97592 PMID:23292513). OXM hormone activity deliberately LEFT on GO:0007189:
  PubMed search found no data showing native OXM drives gluconeogenesis (only rat
  hepatocyte glycine cleavage PMID:9365819, mouse glycogenolysis PMID:22421924, and
  synthetic OXM-based/dual-agonist pharmacology).'
- Built by claude4go with curator 2026-10-12; source table reviewed and corrected
  (MF specificity, cAMP small-molecule link, one CREB1 unit per target, evidence).
  Mostly abstract-level evidence; full texts not read.
- 'GNAS->ADCY6: human ADCY6 activated by Galpha-s in vitro (PMID:17110384, abstract;
  Gs species not stated) -> IC. ADCY6 choice for hepatocyte: mouse glucagon/ADCY6/cAMP/PKA/CREB
  pathway in hepatocytes (PMID:31918924).'
- 'OXM->GCGR: rat hepatocytes, OXM (1 uM) stimulates glycine cleavage flux, ~40% blocked
  by GCGR antagonist (PMID:9365819, abstract) -> ISS from rat Gcg/Gcgr. OXM is a low-affinity
  GCGR agonist; its main receptor is GLP1R. Supporting: hamster insulinoma OXM displaces
  glucagon binding (PMID:8828464); mouse OXM GCGR agonism/liver glycogenolysis (PMID:22421924).'
- 'PKA->CREB1 Ser133: PMID:2573431 (rat PC12) -> ISS RGD. CRTC2: mouse TORC2 regulates
  fasting gluconeogenic CREB transcription (PMID:16148943) -> ISS MGI. CREB1->PCK1/G6PC1:
  mouse CREB mutants reduce gluconeogenic gene expression (PMID:11557984) -> ISS MGI;
  note that in that study CREB acts largely via PGC-1 (not modelled). Not modelled:
  PKA-SIK2 control of CRTC2, CBP/p300, PGC-1alpha.'
