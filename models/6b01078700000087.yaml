id: gomodel:6b01078700000087
title: ELFN1-dependent trans-synaptic wiring of rod photoreceptors to ON-bipolar cells_Visual
  Perception (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-24'
comments:
- Built 2026-11-23 from Cao et al. 2015 PMID:26402607 (mouse) with the ELFN1-CACNA2D4
  link from Wang et al. 2017 PMID:28262416. Human model; all facts ECO:0000250 (ISS)
  GO_REF:0000024 with the mouse orthologs. Companion to the rod model gomodel:6ab067da00012590.
- Curated with GO AI HUB. ELFN1 in the rod terminal binds GRM6 on the ON-bipolar dendrite
  in trans and is required for the primary rod pathway; built from Cao et al. 2015
  PMID:26402607 with the CACNA2D4 link from Wang et al. 2017 PMID:28262416.
