id: gomodel:6ab067da00001836
title: Collagen fibril organization via TIP39-PTH2R-CREB1-DCN (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-01'
comments:
- Curated with GO AI HUB. Human TIP39 activates PTH2R on dermal fibroblasts; PTH2R
  signaling leads (mechanism unknown) to CREB1 activation, CREB1 activates DCN (decorin)
  transcription, and decorin acts in collagen fibril organization; part of TIP39-PTH2R
  positive regulation of collagen fibril organization in wound healing. Companion
  to gomodel:6ab067da00001778 (keratinocyte arm).
- 'Evidence basis: ligand-receptor PMID:34353904 (human cryo-EM). PTH2R in human fibroblasts:
  siRNA lowers ECM genes incl. DCN (PMID:28454729). TIP39-induced CREB phosphorylation/nuclear
  translocation, decorin induction, Tip39-/- wound delay and Pth2r-/- collagen fibril
  defects are mouse data (PMID:28454729) and are transferred by ISS (GO_REF:0000024,
  with MGI). CREB binding to the human DCN promoter: PMID:10966485 (abstract only).
  Decorin in collagen fibril organization: Dcn-null mice, PMID:9024701 (ISS). The
  kinase linking PTH2R to CREB is not identified (authors suggest Gs-AC-cAMP); hence
  causally upstream of, positive effect. pCREB detection is antibody-based.'
