id: gomodel:6ab067da00005098
title: Cone-ON bipolar postsynapse organization via LRIT3_Visual Perception (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-23'
comments:
- '2026-10-02: LRIT3 BP refined per curator - part_of GO:1903539 protein localization
  to postsynaptic membrane (nested part_of GO:0099173 postsynapse organization).'
- '2026-10-05 MF update (curator decision): LRIT3 root GO:0003674 replaced by GO:0098632
  cell-cell adhesion mediator activity, has_input NYX located_in plasma membrane of
  the ON-bipolar cell dendrite (trans). Evidence for LRIT3 enabled_by and has_input
  NYX = NAS ECO:0000303 PMID:42055330 (authors'' model: LRIT3 LRR domain binds nyctalopin
  transsynaptically). CAVEAT: LRIT3-NYX binding was shown only in cis, by co-IP in
  co-transfected HEK293 cells (PMID:31959619); trans binding and adhesion are not
  demonstrated. NYX unit = GO:0030674 protein-macromolecule adaptor activity, has_input
  TRPM1 and GRM6, ISS GO_REF:0000024 with MGI:2448607 (Nyx): Nyx-Trpm1 binding in
  mouse retina (IP-MS/MS) and HEK (PMID:21832182), MYTH + HEK (PMID:21734298); Nyx-Grm6
  binding in HEK only (PMID:21832182); Trpm1 and Grm6 do not bind each other directly
  (MYTH, PMID:21734298). NYX location: mouse DBC dendritic tips (PMID:17881478, PMID:21734298).'
- 'Curated with GO AI HUB. Cone ON-bipolar postsynapse: LRIT3 and NYX organize the
  TRPM1 channel and GRM6 at the dendritic tips.'
- 'LRIT3 causal edges (curator decisions): LRIT3 -RO:0002629 directly positively regulates->
  NYX adaptor (2026-10-05): presynaptic LRIT3 is required for NYX localization at
  cone ON-bipolar dendritic tips (lost in Lrit3 KO, PMID:31959619; LRR domain required,
  PMID:42055330). NYX -RO:0012009 constitutively upstream of-> TRPM1 (nob mice, PMID:21734298).
  LRIT3 -RO:0002407 indirectly positively regulates-> GRM6 (2026-10-02): GRM6/mGluR6
  (with GPR179, RGS7/11) lost at cone ON-bipolar tips in Lrit3 KO (PMID:25997951),
  restored by cone-only LRIT3 (PMID:37091241, PMID:42055330); LRR domain needed for
  mGluR6 (PMID:42055330). 2026-10-05: the direct LRIT3 -> TRPM1 edge was REMOVED (curator
  decision): LRIT3 acts on TRPM1 through NYX, and no direct LRIT3-TRPM1 interaction
  has been shown. Note: NYX is necessary but not sufficient for TRPM1 localization;
  the LRIT3 IG domain is additionally required (PMID:42055330; the authors propose,
  without showing, an IG-TRPM1 interaction). No NYX -> GRM6 edge: GRM6 is has_input
  of the NYX adaptor only.'
- 'Mouse experimental basis for ISS. LRIT3 cone expression and cone pedicle location:
  PMID:31189098 (endogenous cone terminal staining), PMID:37091241 (GNAT2-promoter
  cone rescue), PMID:42055330 (cone terminals). LRIT3 part_of protein localization
  to postsynaptic membrane (GO:1903539; GRM6, GPR179, RGS7/11, NYX and TRPM1 lost
  from cone ON-bipolar tips) part_of postsynapse organization (GO:0099173; PNA loss
  and fewer invaginating ON-bipolar contacts at cone pedicles): PMID:25997951, PMID:28334377,
  PMID:37091241, PMID:42055330. LRIT3 visual perception: PMID:24598786, PMID:42471459
  (photopic acuity rescued by cone LRIT3). TRPM1 channel activity: PMID:19966281 (mouse
  IDA); TRPM1/GRM6 at DBC dendrites: PMID:25997951.'
- 'claude4go build 2026-10-02, updated 2026-10-05 (curator ORCID 0000-0003-1522-9900).
  CONE synapse model; rod counterpart is gomodel:6ab067da00002482. Human. LRIT3, NYX,
  TRPM1 and GRM6-context facts ISS (ECO:0000250, GO_REF:0000024) from mouse orthologs
  (with/from MGI:2685267 Lrit3, MGI:2448607 Nyx, MGI:1330305 Trpm1, MGI:1351343 Grm6),
  except LRIT3 MF enabled_by and has_input NYX = NAS PMID:42055330. GRM6 activity,
  pathway and glutamate activator: human IDA PMID:9407094; GRM6 visual perception:
  IMP PMID:15781871 (as in gomodel:6a6ba88c00000472). Source curation: ~/Phototransduction/LRIT3/
  and ~/Phototransduction/NYX/.'
