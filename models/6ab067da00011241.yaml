id: gomodel:6ab067da00011241
title: Calcitonin biosynthesis in thyroid C cell (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-26'
comments:
- 'Calcitonin biosynthesis in thyroid C cells. CALCA transcription: CREB1 (human TT
  cells, PMID:7476962, PMID:1335241), NKX2-1/TTF-1 (rat data PMID:9819427, PMID:17412341;
  ISS from RGD:3866) and the Ca2+-dependent repressor DREAM/KCNIP3 (PMID:16840549;
  Ca2+ relieves DRE binding). Not modelled: calcitonin-specific exon 4 inclusion (TIAR
  PMID:12917321, SRSF6 PMID:12549914), and the convertase cleaving procalcitonin at
  the multibasic sites (cleavages seen in human MTC, PMID:2572526, PMID:3490472; enzyme
  not identified in C cells, PMID:12114822); CPE omitted. PAM is represented by its
  PHM activity only (GO:0004504), the step toward calcitonin Pro-NH2 (UniProt P01258
  residue 116); C-cell substrate/location ISS from rat (RGD:3252; PMID:1572293, PMID:2744211).
  Transcription -> PAM seams are curator inference (IC). Sources read at abstract
  level.'
