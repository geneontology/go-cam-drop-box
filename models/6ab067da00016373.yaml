id: gomodel:6ab067da00016373
title: Fatty acid beta-oxidation via glucagon-AMPK-ACACB (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-16'
comments:
- Curated with GO AI HUB. Human glucagon-GCGR-cAMP/PKA and AMPK signalling to CPT1A-dependent
  mitochondrial fatty acid beta-oxidation, transferred by ISS from mouse gomodel:6ab067da00013223
  with human experimental evidence where available.
- 'Human model built 2026-11-16 by ISS transfer from mouse gomodel:6ab067da00013223
  (same structure, 12 activities). Mouse experimental evidence -> ISS (ECO:0000250,
  GO_REF:0000024) with the mouse MGI id(s) of the source gene(s); AMPK complex (GO:0031588)
  with Prkaa1 MGI:MGI:2145955 | Prkaa2 MGI:MGI:1336173. Rat ISS (RGD) and IC lines
  kept unchanged. Mouse ISS lines from human proteins replaced by human experimental
  references: GCG/GCGR/GNAS IDA PMID:32193322 (Qiao 2020); GCGR plasma membrane IDA
  PMID:9287038 (Buggy 1997); GNAS has input ADCY6 and GNAS -> ADCY6 IDA PMID:17110384
  (Gao 2007); PRKACA nucleus IDA PMID:21085490; AMPK cytoplasm IDA GO_REF:0000052
  (HPA, PRKAA1 cytosol); CPT2 enabled by IDA PMID:20538056 (Violante 2010); PPARA
  has input CPT1A and PPARA -> CPT1A IDA PMID:16271724 (Napal 2005; abstract only,
  full text not checked). Open: CPT2 has output palmitoyl-CoA has no evidence (Violante
  2010 assayed the reverse reaction; no human forward-reaction paper found). Full
  evidence rationale: comments of gomodel:6ab067da00013223.'
