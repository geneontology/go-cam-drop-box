id: gomodel:6ab067da00012428
title: FGF23-KL-FGFR signaling in kidney distal tubule (Mouse)
taxon: NCBITaxon:10090
status: development
date_modified: '2026-10-30'
comments:
- Built from UniProt FGF23 curation and PMID:24434184 (TRPV5) and PMID:24797667 (NCC),
  full texts. FGFR involvement shown with pan-FGFR inhibitor PD173074; FGFR1c as the
  distal tubule receptor is the authors' model, not genetically shown. SGK1 direct
  phosphorylation of WNK4 reported in PMID:17360471; here supported by SGK1-inhibitor-sensitive
  WNK4 phosphorylation. SPAK/OSR1 not modelled (only background in PMID:24797667).
