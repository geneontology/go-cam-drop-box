id: gomodel:6ab067da00005905
title: Oxyntomodulin production and secretion by L cells (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-06'
comments:
- 'FFAR1/GPR119 -> OXM secretion is IC: OXM rose 5.66x only with combined K-757 (GPR40)
  + K-833 (GPR119) agonists in humans (PMID:40954563, abstract only); receptor expression
  in human L cells from RNA-seq (PMID:30733330).'
- 'Not modelled: CPE C-terminal trimming, bile acid (CDCA) and lipid/glucose stimulation
  of OXM (PMID:33459181, 35961260, 27322465), mouse neuromedin C/GRPR stimulation
  (Grpr is mouse-enriched), OXM in alpha cells/brain.'
- 'OXM enabler = GCG peptide chain UniProtKB:P01275-PRO_0000011255 (aa 53-89). PCSK1->OXM:
  human organoid PCSK1-/- reduces proglucagon-derived peptides by LC-MS/MS (PMID:36343264);
  mouse Pcsk1-/- markedly decreases intestinal OXM (PMID:14630721, abstract; ISS).'
- OXM->GLP1R from GLP1R-transfected HEK293 cAMP blocked by antagonist (PMID:27322465).
  OXM also acts on GCGR (not modelled). GLP1R target cell type not specified.
