comments:
- Curated with GO AI HUB. (CHRNA7)3:(CHRNB2)2 nAChR activated by acetylcholine and
  oligomeric amyloid-beta, negatively regulated by ACHE.
- Replaces stoichiometry test models gomodel:67369e7600001410 and 67369e7600001439
  ((CHRNA7)3:(CHRNB2)2). Both Na+ and Ca2+ captured on one channel activity.
