id: gomodel:6ab067da00013382
title: EDA2R-NIK-myomixer signaling in myoblast fusion (Mouse)
taxon: NCBITaxon:10090
status: production
date_modified: '2026-11-05'
comments:
- Curated with GO AI HUB. EDA-A2/EDA2R-NIK signaling activates non-canonical NF-kappaB
  (p52/RelB), which induces the fusogen Myomixer and drives myogenic progenitor fusion
  in skeletal muscle myoblasts; from PMID:42982041 and PMID:41927716.
