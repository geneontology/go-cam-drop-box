id: gomodel:6ab067da00013093
title: Cholesterol delivery to the plasma membrane by STARD5 and efflux by ABCA1 (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-19'
comments:
- '2026-11-19 edits by ccasalsc (ORCID 0000-0001-8769-177X), agreed with Vitalina,
  after review ~/review-6ab067da00013093-STARD5-ABCA1: (1) ABCA1 MF GO:0120020 ->
  GO:0034041 ABC-type sterol transporter activity (RHEA:39051, EXP PMID:35974019);
  (2) STARD5 occurs in cytosol: PMID:19474188 -> PMID:15897605 (human liver cytosolic
  fractions); (3) intracellular cholesterol transport part of response to ER stress:
  IDA PMID:31015253 (mouse hepatocyte KO) -> IMP PMID:40362395 (Fig. 4, Ad-CMV-hStarD5
  rescue in StarD5-/- liver); (4) STARD5 part of intracellular cholesterol transport:
  IDA -> IMP PMID:31015253 (Fig. 4, human StarD5 overexpression).'
- ABCA1 evidence PMID:11162594 and PMID:19556522 taken from existing experimental
  annotations; read as abstract only in this build. Built 2026-11-03 from review of
  gomodel:689e7a5d00005729.
- Curated with GO AI HUB. STARD5 transfers ER-derived cholesterol to the plasma membrane,
  where ABCA1 exports it to apoA-I (cholesterol efflux); STARD5 acts in the ER-stress
  response.
- 'Not modelled: ER-stress induction of STARD5 via XBP1 (PMID:23053693, mouse 3T3-L1
  only; XBP-1(s) overexpression raises Stard5 mRNA, promoter reporter not responsive,
  mRNA stabilized; IRE1 not tested). NPC1 not modelled: no evidence of a causal link
  to STARD5.'
- 'STARD5 input cholesterol deliberately left without a location: no paper measures
  the source compartment. ER is the authors'' model (PMID:31015253), and PMID:23053693
  proposes ER to Golgi; PMID:15897605 reports overexpression raising microsomal cholesterol.'
- 'STARD5->ABCA1 link: shared plasma-membrane cholesterol node. Supporting data PMID:31015253
  Fig. 1D: StarD5-/- mouse peritoneal macrophages show reduced ABCA1-dependent cholesterol
  efflux to apoA1; cyclosporine A abolishes the WT/KO difference; Ad-human StarD5
  rescues efflux (mouse cells, human protein).'
