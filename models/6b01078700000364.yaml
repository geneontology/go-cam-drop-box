comments:
- Curated with GO AI HUB. HRD1/SYVN1 ubiquitinates METTL14 for proteasomal degradation;
  METTL14-METTL3 m6A methylation destabilises DDIT3/CHOP mRNA, limiting CHOP-driven
  apoptosis during the response to ER stress. Source PMID:34847358.
