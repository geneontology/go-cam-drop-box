id: gomodel:6ab067da00000473
title: M6P tagging via GOLPH3/GOLPH3L-retained LYSET-GNPT (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-20'
comments:
- '2026-10-20: B4GALT5 activity unit added earlier today removed again at curator
  request (no evidence for a causal link downstream of IGF2R). CTSL/HEXB removal kept.'
- '2026-10-20: CTSL and HEXB removed as inputs of GNPTAB and IGF2R; B4GALT5 kept as
  the only cargo input. Added B4GALT5 activity unit (GO:0008489; GlcCer CHEBI:22801
  -> LacCer CHEBI:17950, both located in GO:0160289; part of GO:0001572), regulated
  by GOLPH3 (indirectly positively regulates, IMP PMID:33749896), as in gomodel:6ab067da00000385.'
- 'Built by claude4go 2026-09-23 from Brauer et al 2024 EMBO J (PMID:39587297, full
  text read). GOLPH3 and GOLPH3L are functionally redundant COPI adaptors that bind
  LYSET (co-IP of GOLPH3 with LYSET and with the LYSET-GNPTAB complex; AlphaFold contacts
  via LYSET R37/R39) and retain it in the Golgi; in GOLPH3/GOLPH3L double-KO (not
  single-KO) LYSET and GNPT are lost from the Golgi, degraded in lysosomes (rescued
  by bafilomycin/protease inhibitors), M6P tagging of soluble lysosomal enzymes fails
  and their immature precursors are hypersecreted; GOLPH3 WT but not the PI4P-binding
  mutant R90L rescues. LYSET is modelled as a molecular adaptor retaining/activating
  GNPTAB (Richards 2022 PMID:36074821, Pechincha 2022 PMID:36096887); GNPTAB is the
  catalytic subunit, part of the GNPT complex GO:0070622 (with GNPTG, PMID:26385638).
  Second branch: SPPL3 cleaves B4GALT5 off its membrane anchor and the soluble ectodomain
  is M6P-tagged (anti-M6P precipitation of B4GALT5-V5; absent in GNPTAB/LYSET KO)
  and sorted by the M6P receptor (ammonium chloride causes its secretion; SPPL3 KO
  and D271N abolish it). GOLPH3L edges are IGI with GOLPH3 (double vs single KO).
  IGF2R chosen as the MPR (CI-MPR-deficient mouse serum has soluble B4GALT5, Qian
  2008 cited); M6PR likely redundant, not modelled. Lysosomal degradation of B4GALT5
  is ''likely'' per the authors and not modelled. GOLPH3->LYSET is ''indirectly positively
  regulates'' (retention/level control, not catalysis); LYSET->GNPTAB is direct (physical
  complex).'
- Curated with GO AI HUB. GOLPH3 and GOLPH3L redundantly retain LYSET, and thereby
  the GNPT complex, in the Golgi, enabling mannose 6-phosphate tagging and MPR sorting
  of B4GALT5 after SPPL3 cleavage (Brauer 2024).
