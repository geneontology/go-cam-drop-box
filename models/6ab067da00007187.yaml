id: gomodel:6ab067da00007187
title: Oxyntomodulin biosynthesis in intestinal L cell (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-13'
comments:
- '2026-10-13: OXM hormone activity BP changed from GO:0016486 ''peptide hormone processing''
  (the PCSK1 process that produces OXM, not one OXM acts in) to GO:0007189 ''adenylate
  cyclase-activating G protein-coupled receptor signaling pathway'', per the receptor-ligand
  guideline (ligand part_of the signaling it triggers); GO has no GLP1R- or GCGR-specific
  pathway term. Evidence IDA PMID:17395766 (OXM full agonist for GLP1R-mediated cAMP
  accumulation); receptor species not stated in the abstract, full text not checked.
  Matches the companion model gomodel:6ab067da00005905.'
- 'Built by claude4go with curator 2026-10-12. Source spec checked: all 8 accessions
  correct; GO:0019933 ''cAMP-mediated signaling'' is OBSOLETE (replaced here by GO:0007189
  / GO:0141156); GO:0004930 -> GO:0038182 and GO:0003700 -> GO:0001228 for specificity.
  Abstract-level reading only, no full texts.'
- 'Caveats. (1) ADCY6 is a placeholder: the adenylate cyclase isoform coupled in the
  L cell is not established; the source spec said ''ADCY family''. (2) GPBAR1->Gs
  and Gs->ADCY6 are curator inferences (IC), not assays in L cells. (3) PKA is placed
  in the nucleus (CREB Ser133 phosphorylation), not the cytosol as in the source spec.
  (4) CPE C-terminal trim was deliberately NOT modelled: no evidence found that CPE
  acts on oxyntomodulin specifically. (5) The Wnt/TCF7L2-beta-catenin arm (PMID:15525634)
  is an alternative, L-cell-selective entry into GCG transcription and is not modelled
  here. (6) This chain is shared by all proglucagon-derived peptides; it is OXM-specific
  only at the PCSK1 output.'
- 'Evidence notes. Human experimental data DO exist for this chain, contrary to an
  all-ISS assumption: PMID:36343264 (PNAS 2022) genetically engineered human enteroendocrine
  organoids, PCSK1 knockout, LC-MS/MS -> IMP for the PCSK1 node; GPBAR1 MF is human
  IDA (PMID:12524422). Rodent anchors used as ISS: PMID:15085339 (dominant-negative
  PKA/CREB block proglucagon transcription, mouse STC-1), PMID:17698597 (PC1/3 switch
  -> OXM, mouse). PMID:9528943 (PC1 overexpression raises OXM) is a HAMSTER line (InR1-G9)
  with no MOD id, so it is cited here only as support, not as an ISS with/from source.'
- 'Ligand: bile acid anion (CHEBI:36235, pH-7.3 conjugate-base form; NOT CHEBI:3098
  ''bile acid'', which is the neutral acid class) linked to GPBAR1 by ''is small molecule
  activator of'' (RO:0012005), per the small-molecule-activated receptor pattern.
  IDA PMID:12524422 (bile acids raise cAMP in CHO cells expressing TGR5). The generic
  class was chosen over lithocholate (CHEBI:29744, most potent TGR5 agonist) or chenodeoxycholate
  (CHEBI:36234, raises plasma OXM in PMID:33459181) because the deorphanization paper
  does not single out one species and PMID:33459181 does not show CDCA acting through
  GPBAR1.'
- 'PCSK1 node deviates from the source spec: no ''has output'' oxyntomodulin. GO-CAM
  best practice says not to capture has_output when the has_input is a gene product;
  the handoff is a causal edge to the OXM hormone activity unit instead.'
- 'Seam (steps 5->7): CREB1 has_input the GCG gene and is ''causally upstream of,
  positive effect'' of PCSK1 endopeptidase activity. CREB1 supplies PCSK1''s substrate
  (proglucagon) via transcription+translation; it does NOT regulate the convertase
  itself, so a regulation relation would misstate the mechanism. GO-CAM has no translation
  MF, so no separate synthesis node was created.'
- 'Source-cell biosynthetic chain for oxyntomodulin: GPBAR1 -> Gs -> ADCY6 -> cAMP
  -> PKA -> CREB1 -> (GCG transcription + translation, not represented) -> PCSK1 ->
  OXM. Companion to gomodel:6ab067da00005905 (OXM secretion/action via GLP1R), which
  shares the PCSK1->OXM step.'
