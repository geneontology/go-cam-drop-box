id: gomodel:6ab067da00014325
title: Negative regulation of IGF1R signaling by STC1 (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-11-11'
comments:
- Curated with GO AI HUB. STC1 inhibition of PAPPA/PAPPA2 blocks IGFBP4/IGFBP5 proteolysis
  and IGF1 release, negatively regulating IGF1R signaling (Human).
- 'STC1 inhibits the pappalysins PAPPA (non-covalent, Ki 68 pM; no Cys120 equivalent)
  and PAPPA2, preventing IGFBP4/IGFBP5 cleavage and release of IGF1 for IGF1R. Core
  evidence PMID:26195635 (full text; human recombinant proteins, 293-IGF1R stimulation
  assay with IGF-I/IGFBP4/PAPPA/STC1). PAPPA2 arm: inhibition shown in vitro on IGFBP5;
  effect on IGF1R signaling inferred (IC). IGFBP5 sequestering of IGF1 is IC from
  IGF-I binding (PMID:10766744, abstract only). Not modelled: STC1 mitochondrial/LRP2,
  AMPK-UCP2, IGF2R, L-channel arms. Built by claude4go from Swiss-Prot PAM_STC1.log.'
