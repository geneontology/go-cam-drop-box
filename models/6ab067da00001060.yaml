id: gomodel:6ab067da00001060
title: Regulation of GOLPH3-dependent Golgi enzyme retention (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-20'
comments:
- '2026-10-20: GOLPH3 cargo adaptor has_input trimmed to cargo with shown binding
  (B4GALT5, LYSET, GALNT7). Removed COPA, COPB1 (structure used mouse coatomer), MAN1B1,
  GOLIM4, FAM3C (GOLPH3-dependent levels only, binding not shown). MAN1B1 mannosidase
  activity unit and its indirect regulation by GOLPH3 kept.'
- '2026-10-20: PI4KB activity unit removed (no paper shows PI4KB acting on GOLPH3;
  link rested on inhibitor/yeast data). Replaced by PI4P (CHEBI:58178) ''is small
  molecule activator of'' GOLPH3 cargo adaptor activity (IMP: Golgi PI4P depletion
  and PI4P-binding mutants, PMID:19837035; R90L and PIK93, PMID:42276998), PI4P located
  in GO:0160288 (IC).'
- '2026-10-20: ZDHHC13 changed from protein-cysteine S-palmitoyltransferase activity
  (GO:0019706, has input GOLPH3, directly positively regulates) to molecular_function
  (GO:0003674) causally upstream of, positive effect (RO:0002304) GOLPH3 cargo adaptor
  activity. ZDHHC13 has a non-canonical DQHC motif and is catalytically deficient;
  it promotes substrate S-acylation by a non-catalytic, unknown mechanism (PMID:42717663).
  Its requirement for GOLPH3 Cys-84 acylation rests on knockdown only (PMID:42276998).
  ZDHHC3 kept as the catalytic enzyme.'
- 'Built by claude4go 2026-09-24 as the GENERAL/regulatory layer above GOLPH3, integrating
  Taylor et al 2025 Sci Adv (PMID:41042862; 7.5-A cryo-ET of GOLPH3 in the COPI coat:
  N-terminus LVQ(R14) beta-sheet with beta-COP, folded domain on the alpha-COP beta-propeller
  occluding the KxKxx site, K179E/E183K abolishes retention of Golgi residents; acidic-face
  clusters recognise different clients), Theodoropoulou et al 2026 Nat Commun (PMID:42276998;
  GOLPH3 S-acylated at C84 by ZDHHC13/ZDHHC3 promoting Golgi binding and client retention,
  at C108/C122 by ZDHHC5 antagonising it; APT2 deacylates; NMR/ITC map LCS tail to
  the D247/D258/D262 acidic groove; PIK93 shows PI4KIIIbeta PI4P aids recruitment;
  Golph3-/- mice: GlcCer accumulation, reduced GALNT2 O-glycopeptides, partial embryonic
  lethality, growth and bone defects), and the client papers Rizzo 2021 (PMID:33749896),
  Welch 2021 (PMID:34473204), Brauer 2024 (PMID:39587297). Design: kinase and acyltransferase
  activities carry only the MF plus a direct regulation edge to GOLPH3 cargo adaptor
  activity (project convention; no acyl-CoA/PI4P molecules); GOLPH3 has_input the
  coat subunits COPA and COPB1 and eight representative clients; three downstream
  client activities represent the GSL (B4GALT5, see gomodel:6ab067da00000385), N-glycan
  (MAN1B1) and M6P (LYSET, see gomodel:6ab067da00000473) pathways. APT2 omitted (site
  and sign unknown); GALNT7/GOLIM4/FAM3C inputs only (no experimental MF in GO); mouse
  in vivo phenotypes left for standard mouse annotations. GOLPH3->client edges are
  indirect (retention/level); regulator->GOLPH3 edges are direct (covalent modification
  / lipid recruitment).'
- Curated with GO AI HUB. Regulation of the GOLPH3 cargo adaptor by PI4P and by S-palmitoylation
  (ZDHHC3/ZDHHC13 promote, ZDHHC5 opposes), and its control of representative Golgi
  enzymes of three pathways (Taylor 2025, Theodoropoulou 2026).
