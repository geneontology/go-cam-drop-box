# Criteria for the "true GO-CAM" semantic gate (gate 3) and the ontology-term
# gate (gate 4). Kept as data, not code, so the bar can be loosened later
# (e.g. add model states, drop a requirement) without touching validate_model.py.

# --- Gate 3: "true GO-CAM" semantics ---
# The model's state is the curator's call and is respected as set on noctua-dev
# (kltm, 2026-09-24): a model can legitimately stay in development until its
# source of truth moves. Any real state is accepted except `delete`; gate 5
# still requires the TTL's lego:modelstate to equal the YAML status.
allowed_statuses:
  - production
  - development
  - review
  - internal_test
  - closed
  - template

# Require at least one causal relationship between activities (a connected
# causal graph rather than a bag of isolated activities).
require_causal_edge: true

# Reject models that contain an activity with no causal connection to any other.
require_no_orphan_activity: true

# Require at least one evidence item somewhere in the model.
require_evidence: true

# --- Gate 4: ontology-term validity ---
# CURIE prefixes treated as ontology terms and checked for existence +
# non-obsolescence via oaklib (sqlite:obo:<prefix>). Prefixes NOT listed here
# (gene-product / DB-entity ids like UniProtKB, MGI, PomBase, SGD, WB, and
# reference ids like PMID) are deliberately skipped — validating those is a
# separate, harder problem.
ontology_prefixes:
  - GO
  - RO
  - ECO
  - CHEBI
  - UBERON
  - CL
  - PO
# NCBITaxon is intentionally omitted: checking a single taxon id would download
# the entire multi-GB NCBITaxon database. Taxa are low-risk (rarely obsolete)
# and are still structurally validated by the LinkML gate. Re-add if wanted,
# ideally via a lighter taxon check than the full ontology.

# --- Gates 5-7: the companion TTL (added 2026-09-24) ---
# Every submission under models/ is a PAIR: <id>.yaml and <id>.ttl with the same
# model id (the noctua-dev minted id). The TTL is the artifact that is promoted
# into noctua-models; the YAML is the review/validation surface.
require_companion_ttl: true
# Directory (relative to validation/) holding the noctua-models QC queries. CI
# fetches them from geneontology/noctua-models/sparql at run time so the two
# repos cannot drift; it is gitignored here.
sparql_query_dir: sparql
# If the queries are absent, fail (true) rather than warn (false).
sparql_required: true
