name: validate

# Plain `pull_request` (never pull_request_target): fork PRs run with a
# read-only token and no secrets, so untrusted model files can be validated
# safely. The validation gates are the merge requirement; a maintainer merges.
on:
  pull_request:
    branches: [main]
    paths: ["models/**", "examples/**", "validation/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # oaklib downloads SQLite ontology DBs (via pystow, cached under ~/.data).
      # Cache them so gate 4 only pays the download once per requirements change.
      - name: Cache ontology databases
        uses: actions/cache@v4
        with:
          path: ~/.data
          key: oaklib-sqlite-${{ hashFiles('validation/requirements.txt') }}

      - name: Install validator dependencies
        run: pip install -r validation/requirements.txt

      # Gate 7 runs noctua-models' own QC queries over the submitted TTL. Fetch
      # them at run time (never vendor them) so the drop-box and noctua-models
      # cannot drift. GITHUB_TOKEN is read-only and only lifts the API rate limit.
      - name: Fetch the noctua-models SPARQL QC battery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p validation/sparql
          for u in $(gh api repos/geneontology/noctua-models/contents/sparql --jq '.[] | select(.name|endswith(".rq")) | .download_url'); do
            curl -sfO --output-dir validation/sparql "$u"
          done
          ls -1 validation/sparql
          [ "$(ls validation/sparql/*.rq | wc -l)" -ge 1 ]

      - name: Validate models
        run: |
          set -euo pipefail
          # Always validate the reference examples (a green self-test of all
          # gates, including the TTL gates on the example pair); on a PR, also
          # validate the models it adds/changes (deletions, e.g. a promotion
          # batch leaving the box, have nothing to validate).
          FILES="$(ls examples/*.yaml 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            # A submission is a YAML + TTL pair; a change to either file re-validates
            # the pair (the validator finds the .ttl by name from the .yaml path).
            CHANGED="$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'models/*.yaml' 'models/*.ttl' \
                       | sed -E 's/\.ttl$/.yaml/' | sort -u || true)"
            FILES="$FILES $CHANGED"
          else
            FILES="$FILES $(ls models/*.yaml 2>/dev/null || true)"
          fi
          FILES="$(printf '%s\n' $FILES | sed '/^$/d' | sort -u | tr '\n' ' ')"
          if [ -z "$(printf '%s' "$FILES" | tr -d '[:space:]')" ]; then
            echo "No models to validate."
            exit 0
          fi
          echo "Validating: $FILES"
          python validation/validate_model.py $FILES

  # Advisory only (non-blocking): note whether the PR author is a PUBLIC member
  # of the GO org. Uses the unauthenticated public-members endpoint, so it needs
  # no secret and works on fork PRs. It never blocks merge — the maintainer's
  # merge decision is the real membership gate.
  org-membership-advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public GO-org membership
        run: |
          AUTHOR='${{ github.event.pull_request.user.login }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/orgs/geneontology/public_members/${AUTHOR}")
          if [ "$CODE" = "204" ]; then
            echo "::notice::PR author @${AUTHOR} is a public member of the geneontology org."
          else
            echo "::notice::PR author @${AUTHOR} is NOT a public member of the geneontology org (or membership is private). Submissions are only supported from GO-org members; a maintainer will confirm before merge."
          fi
