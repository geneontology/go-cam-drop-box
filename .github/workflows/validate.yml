name: validate

# Plain `pull_request` (never pull_request_target): fork PRs run with a
# read-only token and no secrets, so untrusted model files can be validated
# safely. The validation gates are the merge requirement; a maintainer merges.
# No path filter: `validate` is the required status check, so it must report on
# every PR (a docs-only PR would otherwise be unmergeable). The examples-only
# run is quick.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A submission touches only models/<id>.yaml and models/<id>.ttl. Anything
      # else (PROMOTIONS.md, README, this workflow) is written by the promotion
      # PRs (branch promoted-*) or repo maintenance (branch admin-*). Concurrent
      # submissions editing a shared file collide at the same lines (#50).
      - name: Submission scope (models/ only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          case "${{ github.head_ref }}" in promoted-*|admin-*) echo "maintenance branch; scope check skipped"; exit 0;; esac
          git fetch --quiet origin "${{ github.base_ref }}"
          OUTSIDE="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v -E '^models/[^/]+\.(yaml|ttl)$' || true)"
          if [ -n "$OUTSIDE" ]; then
            echo "::error::A submission PR may change only models/<id>.yaml and models/<id>.ttl. This PR also changes:"
            printf '  %s\n' $OUTSIDE
            echo "Provenance for a recovered model goes in the TTL as a model comment (CONTRIBUTING.md); PROMOTIONS.md is written by the promotion PR."
            exit 1
          fi
          echo "scope ok: models/ only"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # oaklib downloads SQLite ontology DBs (via pystow, cached under ~/.data).
      # Cache them so gate 4 only pays the download once per requirements change.
      - name: Cache ontology databases
        uses: actions/cache@v4
        with:
          path: ~/.data
          key: oaklib-sqlite-${{ hashFiles('validation/requirements.txt') }}

      - name: Install validator dependencies
        run: pip install -r validation/requirements.txt

      # Gate 7 runs noctua-models' own QC queries over the submitted TTL. Fetch
      # them at run time (never vendor them) so the drop-box and noctua-models
      # cannot drift. GITHUB_TOKEN is read-only and only lifts the API rate limit.
      - name: Fetch the noctua-models SPARQL QC battery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p validation/sparql
          for u in $(gh api repos/geneontology/noctua-models/contents/sparql --jq '.[] | select(.name|endswith(".rq")) | .download_url'); do
            curl -sfO --output-dir validation/sparql "$u"
          done
          ls -1 validation/sparql
          [ "$(ls validation/sparql/*.rq | wc -l)" -ge 1 ]

      - name: Validate models
        run: |
          set -euo pipefail
          # Always validate the reference examples (a green self-test of all
          # gates, including the TTL gates on the example pair); on a PR, also
          # validate the models it adds/changes (deletions, e.g. a promotion
          # batch leaving the box, have nothing to validate).
          FILES="$(ls examples/*.yaml 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            # A submission is a YAML + TTL pair; a change to either file re-validates
            # the pair (the validator finds the .ttl by name from the .yaml path).
            CHANGED="$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'models/*.yaml' 'models/*.ttl' \
                       | sed -E 's/\.ttl$/.yaml/' | sort -u || true)"
            FILES="$FILES $CHANGED"
            # Files this PR ADDS (not merely modifies): a new legacy-style YAML is rejected.
            NEW_FILES="$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- 'models/*.yaml' || true)"
            export NEW_FILES
          else
            FILES="$FILES $(ls models/*.yaml 2>/dev/null || true)"
          fi
          FILES="$(printf '%s\n' $FILES | sed '/^$/d' | sort -u | tr '\n' ' ')"
          if [ -z "$(printf '%s' "$FILES" | tr -d '[:space:]')" ]; then
            echo "No models to validate."
            exit 0
          fi
          echo "Validating: $FILES"
          python validation/validate_model.py $FILES

  # Who may submit: the PR author must hold the `go-ai-hub` permission in GO's
  # users.yaml (geneontology/go-site metadata/users.yaml, authorizations.
  # go-ai-hub.allow-login: true), the same permission that admits them to the GO
  # AI Hub (geneontology/go-jupyter#83). Reads the public file, needs no secret,
  # runs on fork PRs. Required status check once go-site carries the data.
  author-authorized:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: PR author holds go-ai-hub.allow-login in go-site users.yaml
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/geneontology/go-site/master/metadata/users.yaml \
            -o users.yaml
          python3 -m pip install --quiet pyyaml
          python3 - "$AUTHOR" <<'EOF'
          import sys, yaml
          author = sys.argv[1].lower()
          for e in yaml.safe_load(open('users.yaml')):
              gh = ((e.get('accounts') or {}).get('github') or '').strip().lower()
              if gh != author:
                  continue
              hub = (e.get('authorizations') or {}).get('go-ai-hub') or {}
              if hub.get('allow-login') is True:
                  print(f"::notice::@{author} holds go-ai-hub.allow-login in users.yaml ({e.get('nickname')}).")
                  sys.exit(0)
              print(f"::error::@{author} is in users.yaml ({e.get('nickname')}) but has no go-ai-hub.allow-login. "
                    "Ask a GO admin to add the permission (geneontology/go-site metadata/users.yaml).")
              sys.exit(1)
          print(f"::error::@{author} has no users.yaml entry with accounts.github. "
                "Submissions need the go-ai-hub permission in geneontology/go-site metadata/users.yaml.")
          sys.exit(1)
          EOF
